# Throwaway ClickHouse for integration tests: docker compose -f docker-compose.test.yml up -d
name: presstrace-test

services:
  clickhouse-test:
    image: clickhouse/clickhouse-server:26.8.31.2@sha256:05d2e46507afdcf08da46e5528b68847104dbbed691c327e505414b4b7f4e4c8
    environment:
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      - ./clickhouse/config.d/presstrace.xml:/etc/clickhouse-server/config.d/presstrace.xml:ro
      - ./clickhouse/users.d/presstrace.xml:/etc/clickhouse-server/users.d/presstrace.xml:ro
    ports:
      - "18123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

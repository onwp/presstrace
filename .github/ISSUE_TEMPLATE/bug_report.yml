name: Bug report
description: Something in the plugin, the app or the docs does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Plugin
        - App
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Include error messages and logs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PressTrace, WordPress, PHP, and the OS or hosting where the app runs.
      placeholder: PressTrace 0.1.0, WordPress 7.1, PHP 8.3, Docker on Ubuntu 24.04
    validations:
      required: true
  - type: markdown
    attributes:
      value: Remove site keys, passwords and personal data before you post. Report security problems privately, as described in SECURITY.md.
